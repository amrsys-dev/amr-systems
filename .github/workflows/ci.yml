name: AMR Systems CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/amr-systems-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
